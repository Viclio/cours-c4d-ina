# Réglages du site (GitHub Pages / Jekyll)
title: "Cinema 4D – Support de cours"
subtitle: "Motion Design · INA"
description: "Supports de cours Cinema 4D (INA) : semaine 1, modélisation ; semaine 2, texture, lumière, animation et MoGraph."
lang: fr
markdown: kramdown
kramdown:
